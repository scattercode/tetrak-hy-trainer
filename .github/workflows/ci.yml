# Lint and test on every push and pull request. The suite needs no OCR
# stack, no torch and no GPU — the heavy training dependencies arrive
# behind extras with the stages that use them, and stay out of CI until a
# stage genuinely needs one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      # uv.lock pins the full resolved dependency tree (all extras, torch
      # included) so scanners see real versions, not ranges. The lock is
      # universal, so checking it on Linux validates what was written on a
      # Mac. Regenerate with `uv lock` after any pyproject.toml change.
      - name: Lockfile is current
        run: |
          pip install --quiet uv
          uv lock --check

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Test
        run: pytest

  # Same arrangement as Tetrak and scattercode.dev. The committed uv.lock is
  # what makes the scan worthwhile for Python: pyproject.toml declares ranges,
  # but the lock carries every resolved version, so known CVEs in transitive
  # dependencies surface here rather than in a user's install.
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: library
          severity: HIGH,CRITICAL

      # A source-tree SBOM. Because uv.lock is committed, this resolves the
      # full Python dependency tree — unlike a bare pyproject.toml scan.
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-source-tree
          path: sbom.cdx.json
          retention-days: 90

  # cliff.toml and .githooks/commit-msg are copies of the shared templates in
  # scattercode/release-pipelines. They have to be real files here -- git-cliff
  # reads one from the repository root and git runs the other from the checkout
  # -- so they cannot be referenced remotely the way the next-version action
  # is. This is what stops a copy drifting unnoticed, which is the failure that
  # motivated sharing them: thirteen repositories carried them and nothing
  # compared any two.
  templates:
    name: Shared templates are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the shared templates
        uses: actions/checkout@v7
        with:
          repository: scattercode/release-pipelines
          ref: v1
          path: .release-pipelines

      - name: Compare
        run: ./.release-pipelines/sync.sh --check .
