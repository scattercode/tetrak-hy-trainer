# Lint and test on every push and pull request. The suite needs no OCR
# stack, no torch and no GPU — the heavy training dependencies arrive
# behind extras with the stages that use them, and stay out of CI until a
# stage genuinely needs one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest
