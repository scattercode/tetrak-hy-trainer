# Manually-triggered dry run: build an already-released tag and publish it
# to TestPyPI. Exists to prove the Trusted Publisher wiring and package
# metadata work before the first real release goes to PyPI, without
# consuming a real version number.
#
# Needs a pending publisher on test.pypi.org (a separate account from
# pypi.org) naming this workflow filename and the `testpypi` environment,
# and a `testpypi` environment in this repo's settings.
name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. 0.1.1"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade build twine && python -m build && twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
