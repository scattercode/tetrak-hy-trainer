[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]   # 1.27+ understands PEP 639
build-backend = "hatchling.build"

[project]
name = "tetrak-hy-trainer"
# Derived from the git tag, the workspace pattern (see Tetrak): release.yml
# computes the next version from the commit history and tags it, so a literal
# here would be a second source of truth that nothing updates. The weights
# release remains the artefact that matters most; the package version now
# simply follows the same tags.
dynamic = ["version"]
description = "Training pipeline for an Armenian text recogniser, packaged as an EasyOCR custom model"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Stephen Masters" },
    { name = "Yvette Mankerian" },
]
keywords = ["ocr", "armenian", "easyocr", "text-recognition", "archives"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Armenian",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]
# Deliberately thin until the spike pins the trainer's real requirements:
# the charset and packaging modules need only the standard library plus
# PyYAML. torch, the EasyOCR trainer's dependencies and the synthesis
# tooling arrive with the stages that use them, each behind an extra.
dependencies = [
    "pyyaml>=6.0",
    # The Wikisource harvester's API client.
    "requests>=2.31",
]

[project.optional-dependencies]
# pillow sits here as well as in [train]: the augment and synth tests draw
# their own test cards, so CI genuinely exercises them with nothing heavier
# installed. Its absence broke every CI run from the moment those tests
# landed — collection failed on `from PIL import Image` before a single
# test ran.
dev = ["pytest>=8.0", "ruff>=0.5", "pillow>=10.0"]
# What the vendored trainer (training/) imports, beyond the core deps.
# Heavy by design and never installed in CI.
train = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pandas>=1.5",
    "numpy>=1.24",
    "natsort>=8.0",
    "six>=1.16",
    "pillow>=10.0",
    "opencv-python-headless>=4.6",
    # test.py scores validation with nltk's edit distance.
    "nltk>=3.8",
]

[project.urls]
Homepage = "https://github.com/scattercode/tetrak-hy-trainer"
Tetrak = "https://tetrak.dev/"
Source = "https://github.com/scattercode/tetrak-hy-trainer"
Changelog = "https://github.com/scattercode/tetrak-hy-trainer/blob/main/CHANGELOG.md"
Issues = "https://github.com/scattercode/tetrak-hy-trainer/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Writes the resolved version into the package at build time, so an installed
# copy can report it without git present. Generated, therefore gitignored.
version-file = "src/tetrak_hy_trainer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tetrak_hy_trainer"]

[tool.ruff]
line-length = 100
# Vendored upstream code is diffed against upstream, not linted to our rules.
extend-exclude = ["training"]

# The rule set is declared explicitly rather than left to ruff's defaults:
# those differ between ruff versions, so CI and a developer's machine can
# disagree purely on which ruff they installed. Same arrangement as Tetrak.
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    # Line length is enforced by `ruff format`; what survives it is long
    # string literals, which are more readable whole.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["tetrak_hy_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
